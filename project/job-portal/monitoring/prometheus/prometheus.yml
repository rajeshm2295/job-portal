global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-backend'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['backend-api:8080']

  - job_name: 'ubuntu-vm-host'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'docker-containers-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-database-health'
    static_configs:
      - targets: ['postgres-exporter:9187']

