server.port=8080
server.servlet.context-path=/api/v1

# PostgreSQL Database Connection Settings (Docker Compatible)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/jobdb
spring.datasource.username=postgres
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose administrative management endpoints over the network bridge
management.endpoints.web.exposure.include=health,info,prometheus

# Enable detailed metric collection mapping tracking loops
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
